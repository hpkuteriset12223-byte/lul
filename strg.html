<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Firebase Image Viewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-pulse-fast {
            animation: pulse-ring 1.5s infinite ease-in-out;
        }
        /* Style transisi ganti gambar */
        .img-update-flash {
            animation: flash-border 1s ease-out;
        }
        @keyframes flash-border {
            0% { ring-width: 4px; ring-color: rgba(59, 130, 246, 0.8); transform: scale(1.02); }
            100% { ring-width: 0px; ring-color: transparent; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Container Utama Centered -->
    <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700/60 overflow-hidden transition-all duration-300 hover:shadow-blue-500/10 hover:border-slate-600">
        
        <!-- Header Card -->
        <div class="p-5 border-b border-slate-700/60 flex items-center justify-between bg-slate-800/40">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center border border-blue-500/30">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-semibold text-white tracking-wide">Firebase Live Image</h1>
                    <p class="text-xs text-slate-400">Path: <code class="bg-slate-900/60 px-1.5 py-0.5 rounded text-blue-400">data/foto</code></p>
                </div>
            </div>
            <!-- Status Live Indicator -->
            <div id="status-badge" class="flex items-center space-x-2 bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full text-xs font-medium">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                <span id="status-text">Menghubungkan...</span>
            </div>
        </div>

        <!-- Body Card: Container Gambar -->
        <div class="p-6 flex flex-col items-center justify-center">
            
            <div id="image-frame" class="relative w-full aspect-square bg-slate-950 rounded-xl overflow-hidden border border-slate-700/80 shadow-inner flex items-center justify-center transition-all duration-300">
                
                <!-- State Loading / Skeleton -->
                <div id="loading-state" class="flex flex-col items-center justify-center space-y-3 p-6 text-center">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500"></i>
                    <p class="text-xs text-slate-400">Mencoba mengambil data foto realtime...</p>
                </div>

                <!-- State Foto Kosong -->
                <div id="empty-state" class="hidden flex flex-col items-center justify-center space-y-3 p-6 text-center text-slate-500">
                    <i class="fa-regular fa-image text-5xl"></i>
                    <p class="text-xs font-medium">Belum ada foto pada database</p>
                    <p class="text-[11px] text-slate-600">Upload foto baru menggunakan tombol di bawah untuk mengisi data.</p>
                </div>

                <!-- Element Gambar Utama -->
                <img id="firebase-image" src="" alt="Realtime Firebase Image" class="hidden w-full h-full object-cover transition-opacity duration-300">

                <!-- Overlay Info Update Baru -->
                <div id="update-toast" class="opacity-0 transition-opacity duration-500 absolute top-3 right-3 bg-blue-600/90 text-white text-[11px] font-medium px-2.5 py-1 rounded-lg backdrop-blur-sm shadow-lg flex items-center gap-1.5 pointer-events-none">
                    <i class="fa-solid fa-sync fa-spin text-[10px]"></i>
                    <span>Foto Diperbarui!</span>
                </div>
            </div>

            <!-- Detail Terakhir Diupdate -->
            <div class="w-full mt-4 flex items-center justify-between text-xs text-slate-400 px-1">
                <span class="flex items-center gap-1.5">
                    <i class="fa-regular fa-clock text-slate-500"></i>
                    <span>Update Terakhir:</span>
                </span>
                <span id="last-update-time" class="font-mono text-slate-300">-</span>
            </div>
        </div>

        <!-- Footer Card: Upload / Testing Controls -->
        <div class="p-5 bg-slate-950/40 border-t border-slate-700/60 space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-medium text-slate-300">Uji Coba Update Live</span>
                <span class="text-[10px] text-slate-500">Otomatis Convert ke Base64</span>
            </div>

            <div class="flex gap-2">
                <!-- File Input Hidden -->
                <input type="file" id="file-input" accept="image/*" class="hidden">
                
                <!-- Button Trigger Upload -->
                <button id="btn-upload" class="flex-1 bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white text-xs font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg shadow-blue-600/20 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-upload"></i>
                    <span>Pilih & Upload Foto Baru</span>
                </button>

                <!-- Button Hapus Foto -->
                <button id="btn-delete" title="Hapus foto dari database" class="bg-slate-800 hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/30 text-slate-400 border border-slate-700 px-3 py-2.5 rounded-xl transition-all active:scale-95 flex items-center justify-center">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>
            
            <p id="upload-status" class="text-[11px] text-center text-slate-400 h-4"></p>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Firebase dari User
        const firebaseConfig = {
            apiKey: "AIzaSyDyytRYoCnBl2bZAHUsbuYQuqVk7FFv4qs",
            authDomain: "testing-15137.firebaseapp.com",
            databaseURL: "https://testing-15137-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "testing-15137",
            storageBucket: "testing-15137.firebasestorage.app",
            messagingSenderId: "842769771668",
            appId: "1:842769771668:web:324ec92e5b6795e1369881"
        };

        // Inisialisasi App & Database
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Reference ke path: data/foto
        const fotoRef = ref(db, 'data/foto');

        // UI Elements
        const firebaseImage = document.getElementById('firebase-image');
        const loadingState = document.getElementById('loading-state');
        const emptyState = document.getElementById('empty-state');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const lastUpdateTime = document.getElementById('last-update-time');
        const updateToast = document.getElementById('update-toast');
        const imageFrame = document.getElementById('image-frame');
        
        const fileInput = document.getElementById('file-input');
        const btnUpload = document.getElementById('btn-upload');
        const btnDelete = document.getElementById('btn-delete');
        const uploadStatus = document.getElementById('upload-status');

        let isFirstLoad = true;

        // 1. LISTENER REALTIME (onValue)
        // Fungsi ini akan langsung terpanggil saat pertama kali load DAN saat ada perubahan data di node 'data/foto'
        onValue(fotoRef, (snapshot) => {
            // Set status menjadi Terhubung
            updateConnectionStatus(true);

            const fotoBase64 = snapshot.val();

            if (fotoBase64) {
                // Tampilkan foto jika data ada
                displayImage(fotoBase64);
                
                // Efek Visual animasi ketika ada update baru (bukan load pertama)
                if (!isFirstLoad) {
                    triggerUpdateAnimation();
                }
                isFirstLoad = false;
            } else {
                // Tampilkan empty state jika data kosong/null
                displayEmpty();
                isFirstLoad = false;
            }

            // Catat Waktu Update Terakhir
            const now = new Date();
            lastUpdateTime.innerText = now.toLocaleTimeString('id-ID') + ' WIB';
        }, (error) => {
            console.error("Firebase Read Error:", error);
            updateConnectionStatus(false, "Gagal Terhubung");
            uploadStatus.innerText = "Error: " + error.message;
            uploadStatus.className = "text-[11px] text-center text-red-400 h-4";
        });

        // Function untuk menampilkan Gambar Base64
        function displayImage(base64Data) {
            loadingState.classList.add('hidden');
            emptyState.classList.add('hidden');
            
            // Cek apakah string sudah include header data:image
            let srcString = base64Data;
            if (!base64Data.startsWith('data:image')) {
                srcString = `data:image/jpeg;base64,${base64Data}`;
            }

            firebaseImage.src = srcString;
            firebaseImage.classList.remove('hidden');
        }

        // Function untuk tampilan kosong
        function displayEmpty() {
            loadingState.classList.add('hidden');
            firebaseImage.classList.add('hidden');
            emptyState.classList.remove('hidden');
        }

        // Status Indicator Helper
        function updateConnectionStatus(isConnected, message = "Realtime Live") {
            if (isConnected) {
                statusBadge.className = "flex items-center space-x-1.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-xs font-medium";
                statusBadge.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>${message}</span>
                `;
            } else {
                statusBadge.className = "flex items-center space-x-1.5 bg-red-500/10 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-xs font-medium";
                statusBadge.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-red-400"></span>
                    <span>${message}</span>
                `;
            }
        }

        // Efek Toast / Frame animasi saat gambar berubah
        function triggerUpdateAnimation() {
            // Flash frame
            imageFrame.classList.add('img-update-flash');
            setTimeout(() => imageFrame.classList.remove('img-update-flash'), 1000);

            // Pop toast
            updateToast.classList.remove('opacity-0');
            setTimeout(() => {
                updateToast.classList.add('opacity-0');
            }, 2500);
        }

        // 2. FITUR UPLOAD GAMBAR BARU KE FIREBASE (TESTING REALTIME UPDATE)
        btnUpload.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Batasi ukuran file opsional (misal max 2MB agar Base64 tidak terlalu besar)
            if (file.size > 2 * 1024 * 1024) {
                uploadStatus.innerText = "Gagal: Ukuran gambar maksimal 2MB!";
                uploadStatus.className = "text-[11px] text-center text-amber-400 h-4";
                return;
            }

            uploadStatus.innerText = "Membaca & mengonversi foto...";
            uploadStatus.className = "text-[11px] text-center text-blue-400 h-4";
            btnUpload.disabled = true;

            const reader = new FileReader();
            reader.onload = async function (event) {
                const base64String = event.target.result;

                try {
                    uploadStatus.innerText = "Mengirim ke Firebase...";
                    // Simpan data Base64 langsung ke path: data/foto
                    await set(ref(db, 'data/foto'), base64String);
                    
                    uploadStatus.innerText = "Foto berhasil diupdate ke Realtime DB!";
                    uploadStatus.className = "text-[11px] text-center text-emerald-400 h-4";
                    
                    setTimeout(() => { uploadStatus.innerText = ""; }, 3000);
                } catch (err) {
                    console.error("Upload Error:", err);
                    uploadStatus.innerText = "Gagal simpan data: " + err.message;
                    uploadStatus.className = "text-[11px] text-center text-red-400 h-4";
                } finally {
                    btnUpload.disabled = false;
                    fileInput.value = ''; // Reset input file
                }
            };

            reader.readAsDataURL(file);
        });

        // 3. FITUR HAPUS FOTO
        btnDelete.addEventListener('click', async () => {
            uploadStatus.innerText = "Menghapus foto...";
            uploadStatus.className = "text-[11px] text-center text-amber-400 h-4";
            try {
                await remove(ref(db, 'data/foto'));
                uploadStatus.innerText = "Foto di path data/foto berhasil dihapus.";
                uploadStatus.className = "text-[11px] text-center text-slate-400 h-4";
                setTimeout(() => { uploadStatus.innerText = ""; }, 3000);
            } catch (err) {
                uploadStatus.innerText = "Gagal menghapus: " + err.message;
                uploadStatus.className = "text-[11px] text-center text-red-400 h-4";
            }
        });
    </script>
</body>
</html>
